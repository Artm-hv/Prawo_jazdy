<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    window.addEventListener('error', function(e) {
        const err = document.createElement('div');
        err.style = 'position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:99999;padding:20px;font-size:20px;word-break:break-all;';
        err.innerText = 'JS ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        document.body.appendChild(err);
    });
  </script>
  <title>Prawo Jazdy - Baza Wiedzy i Szkolenie Online</title>
  
  <!-- Modern Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ==========================================================================
       Top Navigation Bar (Centered Navigation Links & Settings Gear Icon)
       ========================================================================== -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="nav-left">
        <a href="#" class="brand-logo">
          <span class="highlight">Prawo</span> Jazdy
        </a>
      </div>

      <!-- Centered Navigation Links -->
      <nav class="nav-center">
        <ul class="nav-links">
          <li class="nav-item" data-tab="testy">Testy</li>
          <li class="nav-item" data-tab="kurs">Kurs</li>
          <li class="nav-item" data-tab="wyklady">Wykłady</li>
          <li class="nav-item" data-tab="podrecznik">Podręcznik</li>
          <li class="nav-item active" data-tab="szkolenie">Szkolenie z instruktorem</li>
          <li class="nav-item" data-tab="znaki">Znaki drogowe</li>
          <li class="nav-item" data-tab="statystyki">Statystyki</li>
        </ul>
      </nav>

      <!-- Right Side: Settings Gear Icon Button -->
      <div class="nav-right">
        <button class="settings-gear-btn" onclick="window.app.toggleSettingsModal()" title="Ustawienia serwisu">
          ⚙
        </button>
      </div>
    </div>
  </header>

  <!-- ==========================================================================
       Main Responsive Layout
       ========================================================================== -->
  <div class="main-container" id="main-layout-container" style="grid-template-columns: 1fr;">

    <!-- Right Content Area -->
    <main class="content-area">

      <!-- Dynamic Tab Container for Exam Tests, Signs Catalog, Stats Dashboard, Lectures -->
      <div id="tab-content-container" class="view-transition-wrapper" style="display: none;"></div>

    </main>
  </div>

  <!-- ==========================================================================
       Settings Modal Popup (Gear Icon Menu)
       ========================================================================== -->
  <div class="modal-backdrop" id="settings-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">⚙ Ustawienia serwisu</h3>
        <button class="modal-close-btn" onclick="window.app.toggleSettingsModal()">✕</button>
      </div>

      <div class="modal-body">
        <!-- 1. Category Selection -->
        <div class="setting-item">
          <label class="setting-label">🚗 Wybór kategorii prawa jazdy</label>
          <select class="setting-select" id="setting-category-select" onchange="window.app.setCategory(this.value)">
            <option value="AM">Kategoria AM (Motorowery)</option>
            <option value="A1">Kategoria A1 (Motocykle do 125 cm³)</option>
            <option value="A2">Kategoria A2 (Motocykle do 35 kW)</option>
            <option value="A">Kategoria A (Wszystkie motocykle)</option>
            <option value="B" selected>Kategoria B (Samochody osobowe)</option>
            <option value="B1">Kategoria B1 (Czterokołowce)</option>
            <option value="C">Kategoria C (Samochody ciężarowe)</option>
            <option value="D">Kategoria D (Autobusy)</option>
            <option value="T">Kategoria T (Ciągniki rolnicze)</option>
          </select>
        </div>

        <!-- 2. Language Selection -->
        <div class="setting-item">
          <label class="setting-label">🌐 Wybór języka serwisu</label>
          <select class="setting-select" id="setting-language-select" onchange="window.app.setLanguage(this.value)">
            <option value="PL">🇵🇱 Polski</option>
            <option value="UA">🇺🇦 Українська</option>
            <option value="EN">🇬🇧 English</option>
          </select>
        </div>

        <!-- 3. Dark Mode Toggle -->
        <div class="setting-item flex-between">
          <div>
            <label class="setting-label">🌙 Ciemny motyw (Dark Mode)</label>
            <p class="setting-subtext">Przełącz wygląd serwisu na ciemny фіолетовий колір</p>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="dark-mode-toggle" onchange="window.app.toggleDarkMode(this.checked)">
            <span class="slider round"></span>
          </label>
        </div>
      </div>

      <div class="modal-footer">
        <button class="modal-save-btn" onclick="window.app.toggleSettingsModal()">Gotowe</button>
      </div>
    </div>
  </div>

  <!-- Data Scripts (Client-Side Standalone Data) -->
  <script src="js/data/trafficSignsData.js"></script>
  <script src="js/data/testQuestionsData.js"></script>
  <script src="js/data/courseData.js"></script>
  <script src="js/data/courseModulesData.js"></script>
  <script src="js/data/lecturesData.js"></script>
  <script src="js/data/textbookData.js"></script>
  <script src="js/data/instructorData.js"></script>

  <!-- JavaScript Modules -->
  <script src="js/api.js"></script>
  <script src="js/testEngine.js"></script>
  <script src="js/signCatalog.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/courseEngine.js"></script>
  <script src="js/lectures.js"></script>
  <script src="js/textbook.js"></script>
  <script src="js/instructorEngine.js"></script>
  <script src="js/flashcardsEngine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

<!-- trigger update -->
